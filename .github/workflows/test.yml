name: Demo-only bridge tests
on:
  push:
    branches: [feature/demo-ai-mt5-integration]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/server.mjs
          node --check src/risk.mjs
      - name: Unit and mocked bridge tests
        run: npm test
